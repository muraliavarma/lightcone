<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lightcone — unfold the real universe</title>
<meta name="description" content="Unfold real telescope imagery into a 3D map of up to 2.8 million measured galaxies, quasars, and stars. Explore DESI DR1 by distance and cosmic time.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070B">
<meta property="og:title" content="Lightcone — unfold the real universe">
<meta property="og:description" content="The photographed sky and its measured depth, in one continuous map.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lightcone.murlax.com">
<meta property="og:image" content="https://lightcone.murlax.com/data/home_coma_dr11.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='5' fill='%23D9A84E'/%3E%3Cpath d='M32 3 11 57h42z' fill='none' stroke='%23E9E4D8' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>

<canvas id="stage"></canvas>

<div id="hud">

  <header class="tl">
    <h1>Lightcone</h1>
    <p>every dot is a real measurement</p>
  </header>

  <nav class="tr" aria-label="Layers">
    <button class="chip" data-group="stars"  aria-pressed="true"><i style="--c:#F2EFE7"></i>Stars</button>
    <button class="chip" data-group="nearby" aria-pressed="true"><i style="--c:#CFC9BC"></i>Nearby</button>
    <button class="chip" data-group="web"    aria-pressed="true"><i style="--c:#E5C078"></i>Cosmic web</button>
    <button class="chip" data-group="qso"    aria-pressed="true"><i style="--c:#A78BDB"></i>Quasars</button>
    <span class="gap"></span>
    <button class="chip" id="chipPhoto" aria-pressed="true">photo</button>
    <button class="chip" id="chipTour">tour</button>
  </nav>

  <div class="bc">
    <div class="seg" role="group" aria-label="Mode">
      <button id="mPhoto" class="on" aria-pressed="true">Photo · 2D</button>
      <button id="mDepth" aria-pressed="false">Depth · 3D</button>
    </div>
    <button class="chip" id="btnHome">Home</button>
    <button class="chip hidden" id="btnFree">release camera</button>
  </div>

  <div class="epoch" id="epoch">
    <button class="chip" id="chipEpoch" aria-pressed="false" aria-expanded="false" title="Isolate measurements from one band of cosmic history">time lens</button>
    <div class="epochControl" id="epochControl" hidden>
      <span class="epochNow">now</span>
      <input id="epochRange" type="range" min="0" max="12800" step="25" value="5000" aria-label="Lookback time in millions of years">
      <span class="epochOld">12.8 Gyr</span>
      <output id="epochOut" for="epochRange" aria-live="polite">5.00 Gyr ago · ±0.45</output>
      <button class="epochClose" id="epochClose" aria-label="Show all cosmic time">×</button>
    </div>
  </div>

  <div class="bl" id="readout"></div>
  <div class="br"><span id="rPoints">0</span> points<span class="sep">·</span><span id="rFps">--</span> fps</div>

  <div class="src" id="imgSrc"></div>
  <div class="hint" id="hint">drag to look around · scroll to zoom · press <b>Depth · 3D</b> to unfold the sky</div>
  <div class="credit">Real data: DESI × Legacy Surveys × Gaia × Cosmicflows · credits in README</div>

  <div class="tour" id="tourCard" hidden>
    <div class="tHead"><span id="tStep"></span><button class="x" id="tExit" aria-label="Exit tour">×</button></div>
    <h2 id="tTitle"></h2>
    <p id="tText"></p>
    <div class="tNav"><button class="chip" id="tPrev">← back</button><button class="chip gold" id="tNext">next →</button></div>
  </div>

  <div class="tip" id="tip" hidden></div>

  <div class="selectionMark" id="selectionMark" hidden aria-hidden="true">
    <span></span><b id="selectionLabel"></b>
  </div>

  <aside id="panel" aria-hidden="true" aria-label="Object details" tabindex="-1"></aside>

  <div class="boot" id="boot" role="status" aria-live="polite"><span>reading the sky…</span></div>
</div>

<script type="module" src="src/main.js?v=3"></script>
</body>
</html>
